<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Levi S. Porto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* Photo */
        .photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #1a1a1a;
            border: 2px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            position: relative;
        }

        .photo::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: conic-gradient(from 180deg, #00e5ff, #7c4dff, #ff4081, #00e5ff);
            z-index: -1;
            filter: blur(8px);
            opacity: 0.5;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
        }

        /* Name & Description */
        .name {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 0.5px;
            font-family: 'Manrope', sans-serif;
        }

        .description {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            line-height: 1.5;
            max-width: 300px;
            font-family: 'Manrope', sans-serif;
        }

        /* Links */
        .links {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 8px;
        }

        .link {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            border-radius: 50px;
            text-decoration: none;
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.3px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        /* Inner color glow — always visible */
        .link::before {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 10%;
            right: 10%;
            height: 70%;
            border-radius: 50%;
            filter: blur(16px);
            opacity: 0.35;
            transition: opacity 0.3s ease;
            z-index: 0;
        }

        .link:hover {
            transform: translateY(-2px);
        }

        .link:hover::before {
            opacity: 0.7;
        }

        /* Instagram */
        .link--instagram {
            border-color: rgba(225, 48, 108, 0.25);
            color: #f7a8c4;
        }
        .link--instagram::before {
            background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }
        .link--instagram:hover {
            border-color: rgba(225, 48, 108, 0.45);
            color: #fff;
        }

        /* GitHub */
        .link--github {
            border-color: rgba(124, 77, 255, 0.25);
            color: #c4b5fd;
        }
        .link--github::before {
            background: #7c4dff;
        }
        .link--github:hover {
            border-color: rgba(124, 77, 255, 0.45);
            color: #fff;
        }

        /* LinkedIn */
        .link--linkedin {
            border-color: rgba(0, 119, 181, 0.25);
            color: #7dd3fc;
        }
        .link--linkedin::before {
            background: #0077b5;
        }
        .link--linkedin:hover {
            border-color: rgba(0, 119, 181, 0.45);
            color: #fff;
        }

        .link svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .link span {
            position: relative;
            z-index: 1;
        }

        .link .arrow {
            margin-left: auto;
            color: rgba(255, 255, 255, 0.3);
            font-size: 18px;
            position: relative;
            z-index: 1;
            transition: color 0.3s ease;
        }

        .link:hover .arrow {
            color: rgba(255, 255, 255, 0.6);
        }

        /* Glow behind container */
        .glow {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 220px;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .glow::before {
            content: '';
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 260px;
            background: radial-gradient(ellipse at center bottom,
                rgba(12, 152, 173, 0.18) 0%,
                rgba(80, 60, 255, 0.14) 35%,
                rgba(120, 40, 200, 0.08) 60%,
                transparent 80%
            );
            filter: blur(22px);
            border-radius: 50%;
        }

        .glow::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(80, 120, 255, 0.15) 20%,
                rgba(0, 220, 255, 0.25) 50%,
                rgba(80, 120, 255, 0.15) 80%,
                transparent 100%
            );
        }
    </style>
</head>
